<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - Goodmoney</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fa;
      min-height: 100vh;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #172033;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #687386;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ccd3dc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #087f5b;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: #087f5b;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #066b4d;
    }

    .register {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #087f5b;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #687386;
      text-decoration: none;
    }

    .demo {
      margin-top: 20px;
      padding: 14px;
      background: #fff3cd;
      color: #856404;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #687386;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Goodmoney</h1>
</header>


<div class="container">

  <div class="form-box">

    <h2>Connexion</h2>

    <p class="description">
      Connectez-vous à votre espace Goodmoney.
    </p>


    <form id="loginForm">

      <label for="login">
        E-mail ou numéro de téléphone
      </label>

      <input
        type="text"
        id="login"
        placeholder="E-mail ou téléphone"
        required
      >


      <label for="password">
        Mot de passe
      </label>

      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        required
      >


      <button
        type="submit"
        class="btn"
      >
        Se connecter
      </button>

    </form>


    <div class="demo">

      ⚠️ <strong>Mode démonstration</strong><br>

      Cette connexion permet actuellement
      d'accéder à la maquette du tableau de bord.
      L'authentification réelle sera ajoutée avec
      un serveur sécurisé.

    </div>


    <a
      href="Inscription.html"
      class="register"
    >
      Créer un compte
    </a>


    <a
      href="index.html"
      class="back"
    >
      ← Retour à l'accueil
    </a>

  </div>

</div>


<footer>
  © 2026 Goodmoney
</footer>


<script>

  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      /*
        Démonstration uniquement :
        redirection vers le tableau de bord.
      */

      window.location.href = "Dashboard.html";

    });

</script>

</body>

</html>
