<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Goodmoney | Investissement</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    /* HEADER */

    header {
      background: #087f5b;
      color: white;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 28px;
    }

    .connexion {
      color: white;
      text-decoration: none;

      border: 1px solid white;
      padding: 12px 20px;

      border-radius: 10px;
      font-size: 17px;
    }

    /* ACCUEIL */

    .hero {
      background: white;
      text-align: center;

      padding: 90px 20px;
    }

    .hero h2 {
      font-size: 42px;
      line-height: 1.2;

      margin-bottom: 25px;
    }

    .hero h2 span {
      color: #087f5b;
    }

    .hero p {
      color: #687386;
      font-size: 20px;

      line-height: 1.6;

      max-width: 700px;
      margin: 0 auto 45px;
    }

    /* BOUTON */

    .btn {
      display: inline-block;

      background: #087f5b;
      color: white;

      text-decoration: none;

      padding: 17px 45px;

      border-radius: 10px;

      font-size: 20px;
      font-weight: bold;
    }

    .btn:hover {
      background: #066b4d;
    }

    /* PLANS */

    .plans {
      padding: 70px 20px;

      text-align: center;
    }

    .plans h2 {
      font-size: 38px;

      margin-bottom: 40px;
    }

    .cards {

      max-width: 1000px;

      margin: auto;

      display: grid;

      grid-template-columns:
      repeat(auto-fit, minmax(250px, 1fr));

      gap: 25px;
    }

    /* CARTE */

    .card {

      background: white;

      padding: 30px;

      border-radius: 18px;

      text-align: left;

      box-shadow:
      0 5px 20px rgba(0,0,0,0.06);
    }

    .card h3 {

      color: #087f5b;

      font-size: 25px;

      margin-bottom: 20px;
    }

    .
