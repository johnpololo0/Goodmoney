<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - Goodmoney</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fa;
      min-height: 100vh;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #172033;
    }

    .description {
      text-align: center;
      color: #687386;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ccd3dc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #087f5b;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: #087f5b;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #066b4d;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #087f5b;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #e8f7f1;
      color: #087f5b;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #687386;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .form-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Goodmoney</h1>
</header>

<div class="container">

  <div class="form-box">

    <h2>Créer un compte</h2>

    <p class="description">
      Créez votre compte Goodmoney pour accéder
      à votre espace personnel.
    </p>

    <form id="registerForm">

      <label for="name">
        Nom complet
      </label>

      <input
        type="text"
        id="name"
        placeholder="Exemple : Jean Kouassi"
        required
      >


      <label for="phone">
        Numéro de téléphone
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Exemple : 0700000000"
        required
      >


      <label for="email">
        Adresse e-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Exemple : exemple@email.com"
        required
      >


      <label for="password">
        Mot de passe
      </label>

      <input
        type="password"
        id="password"
        placeholder="Créer un mot de passe"
        required
      >


      <label for="confirmPassword">
        Confirmer le mot de passe
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirmer le mot de passe"
        required
      >


      <label for="plan">
        Choisir un montant
      </label>

      <select id="plan" required>

        <option value="">
          Sélectionner un montant
        </option>

        <option value="3000">
          3 000 FCFA
        </option>

        <option value="5000">
          5 000 FCFA
        </option>

        <option value="10000">
          10 000 FCFA
        </option>

        <option value="25000">
          25 000 FCFA
        </option>

        <option value="50000">
          50 000 FCFA
        </option>

      </select>


      <button
        type="submit"
        class="btn"
      >
        Créer mon compte
      </button>

    </form>


    <div
      class="message"
      id="message"
    >
      Votre compte de démonstration a été créé.
    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Retour à l'accueil
    </a>

  </div>

</div>

<footer>
  © 2026 Goodmoney
</footer>


<script>

  document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {

        alert("Les deux mots de passe ne correspondent pas.");

        return;
      }

      document
        .getElementById("message")
        .style.display = "block";

      document
        .getElementById("registerForm")
        .reset();

    });

</script>

</body>
</html>
