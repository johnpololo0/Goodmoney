<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Goodmoney - Inscription</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .form-card {
      background: white;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #087f5b;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #066b4c;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #e9f7f2;
      border-radius: 8px;
      color: #087f5b;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #667085;
    }

    .login a {
      color: #087f5b;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #087f5b;
      text-decoration: none;
    }

    .warning {
      margin-top: 25px;
      padding: 15px;
      background: #fff4e5;
      border-left: 4px solid #f08c00;
      line-height: 1.5;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Goodmoney</h1>
  </header>

  <div class="container">

    <div class="form-card">

      <h2>Créer un compte</h2>

      <p class="description">
        Créez votre compte Goodmoney pour accéder
        à votre espace personnel.
      </p>

      <form id="signupForm">

        <label for="nom">Nom complet</label>
        <input
          type="text"
          id="nom"
          placeholder="Votre nom complet"
          required
        >

        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          placeholder="exemple@email.com"
          required
        >

        <label for="telephone">Numéro de téléphone</label>
        <input
          type="tel"
          id="telephone"
          placeholder="07 XX XX XX XX"
          required
        >

        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          placeholder="Votre mot de passe"
          required
          minlength="8"
        >

        <label for="confirmation">
          Confirmer le mot de passe
        </label>

        <input
          type="password"
          id="confirmation"
          placeholder="Confirmez votre mot de passe"
          required
          minlength="8"
        >

        <button type="submit">
          Créer mon compte
        </button>

      </form>

      <div class="message" id="message"></div>

      <div class="login">
        Vous avez déjà un compte ?
        <a href="#">Se connecter</a>
      </div>

      <a class="back" href="index.html">
        ← Retour à l'accueil
      </a>

      <div class="warning">
        ⚠️ <strong>Mode démonstration :</strong>
        cette page ne crée pas encore de compte financier réel
        et ne collecte aucun paiement.
      </div>

    </div>

  </div>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const nom = document.getElementById("nom").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmation =
        document.getElementById("confirmation").value;

      if (password !== confirmation) {

        message.style.display = "block";
        message.style.background = "#ffecec";
        message.style.color = "#c92a2a";

        message.textContent =
          "Les deux mots de passe ne correspondent pas.";

        return;
      }

      message.style.display = "block";
      message.style.background = "#e9f7f2";
      message.style.color = "#087f5b";

      message.textContent =
        "Bienvenue " + nom +
        " ! Votre inscription est enregistrée en mode démonstration.";

      form.reset();
    });
  </script>

</body>
</html>
